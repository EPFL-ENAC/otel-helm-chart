      #      endpoint: 0.0.0.0:{{ .Values.collector.receivers.grpc.port }}
      #    http:
      #      endpoint: 0.0.0.0:{{ .Values.collector.receivers.http.port }}

    processors:
      # filter:
      #   error_mode: ignore
      #   metrics:
      #     datapoint:
      #       - 'attributes["http.route"] == "/health"'
      #       - 'attributes["http.route"] == "/healthz"'
      #       - 'attributes["http.route"] == "/ready"'
      # tail_sampling:
      #   policies:
      #     - name: drop-health
      #       type: string_attribute
      #       string_attribute:
      #         key: http.target
      #         values:
      #           - /health
      #           - /healthz
      #           - /ready
      #         invert_match: true

    exporters:
      # prometheus:
      #   endpoint: 0.0.0.0:{{ .Values.collector.exporters.port }}
      #   resource_to_telemetry_conversion:
      #     enabled: true
      # otlp/jaeger:
      #   endpoint: {{ include "otel.fullname" . }}-jaeger:{{ .Values.jaeger.endpoints.grpc.port }}
      #   tls:
      #     insecure: true

    service:
      # pipelines:
      #   traces:
      #     receivers: [otlp]
      #     processors: [filter, tail_sampling]
      #     exporters: [otlp/jaeger]
      #   metrics:
      #     receivers: [otlp]
      #     processors: [filter]
      #     exporters: [prometheus]

  metrics:
    grafanaMonitor:
      enabled: true

  resources:
    limits:
      memory: "256Mi"
    requests:
      cpu: "10m"
      memory: "256Mi"

jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.49"
  
  # jaeger.memoryMaxTraces
  # Maximum number of traces that can be stored in memory. Once the limit is reached, new traces will be dropped until some of the existing traces are flushed to the storage backend. Setting this value to 0 means no limit.
  memoryMaxTraces: 10000

  endpoints:
    grpc:
      port: 4317
    http:
      port: 16686

  resources:
    limits:
      memory: "512Mi"
    requests:
      cpu: "10m"
      memory: "512Mi"
